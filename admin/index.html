<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><title>Uzmantech Admin</title><style>body{margin:0;background:#07111f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}.box{max-width:900px;margin:30px auto;padding:16px}.card{background:#0d1a2b;border:1px solid #263b56;border-radius:16px;padding:18px;margin-bottom:14px}.login{max-width:420px;margin:12vh auto}.input{width:100%;box-sizing:border-box;padding:15px;border-radius:12px;border:1px solid #304965;background:#07111f;color:#fff;font-size:18px;margin:6px 0 14px}.btn{border:0;border-radius:11px;padding:12px 16px;background:#246fd1;color:#fff;font-weight:700;font-size:15px}.muted{color:#9db0c6}.err{background:#3a171b;border:1px solid #74333a;color:#ffb0b0;padding:11px;border-radius:10px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#102238;padding:14px;border-radius:12px}.n{font-size:24px;font-weight:800}@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}.login{margin:7vh auto}}</style></head><body><div id="login" class="box login"><div class="card"><h1>Uzmantech Admin</h1><div class="muted">Temiz giriş ekranı</div><label>Kullanıcı adı</label><input id="u" class="input" autocomplete="username" autocapitalize="none" autocorrect="off"><label>Şifre</label><input id="p" class="input" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false"><div id="e" class="err" style="display:none"></div><button id="go" class="btn" style="width:100%">Giriş Yap</button></div></div><div id="app" class="box" style="display:none"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><h1>Uzmantech Admin</h1><div class="muted">Bağlantı aktif</div></div><button id="out" class="btn">Çıkış</button></div></div><div class="grid"><div class="stat"><div class="n" id="t">-</div><div class="muted">Toplam</div></div><div class="stat"><div class="n" id="a">-</div><div class="muted">Aktif</div></div><div class="stat"><div class="n" id="q">-</div><div class="muted">Bekleyen</div></div><div class="stat"><div class="n" id="d">-</div><div class="muted">Cihaz</div></div></div><div class="card"><h2>Kullanıcılar</h2><input id="s" class="input" placeholder="Kullanıcı ara"><div id="list">Yükleniyor...</div></div></div><script>const B="https://iutehccebzqnhqkevawz.supabase.co/functions/v1";let token="",users=[];const $=x=>document.getElementById(x),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function dh(){let x=localStorage.getItem("uzm_admin_install_v4");if(!x){x=crypto.randomUUID();localStorage.setItem("uzm_admin_install_v4",x)}let h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(x));return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("")}async function login(){let u=$("u").value.trim(),p=$("p").value;if(!u||!p)throw Error("Kullanıcı adı ve şifre zorunludur.");let r=await fetch(B+"/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u,password:p,device_hash:await dh()})}),j=await r.json().catch(()=>({}));if(!r.ok||!j.success||!j.session_token)throw Error(j.message||("Sunucu hatası: HTTP "+r.status));token=j.session_token}async function api(action,data={}){let r=await fetch(B+"/rapid-service",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({action,...data})}),j=await r.json().catch(()=>({}));if(!r.ok||j.success===false)throw Error(j.message||("API hatası: HTTP "+r.status));return j}async function load(){let [u,s]=await Promise.all([api("list"),api("dashboard_stats")]);users=u.users||[];let z=s.stats||{};$("t").textContent=z.total??users.length;$("a").textContent=z.active??0;$("q").textContent=z.pending??0;$("d").textContent=z.devices??0;render()}function render(){let q=$("s").value.trim().toLowerCase();let x=users.filter(u=>[u.username,u.email,u.phone].join(" ").toLowerCase().includes(q));$("list").innerHTML=x.map(u=>'<div class="card"><b>'+esc(u.username)+'</b><div class="muted">'+esc(u.email||"")+' • '+esc(u.status)+' • Bitiş: '+esc(u.expiry_date||"Yok")+'</div></div>').join("")||"Kullanıcı bulunamadı."}$("go").onclick=async()=>{$("e").style.display="none";$("go").disabled=true;try{await login();$("login").style.display="none";$("app").style.display="block";await load()}catch(e){$("e").textContent=e.message;$("e").style.display="block"}finally{$("go").disabled=false}};$("p").onkeydown=e=>{if(e.key==="Enter")$("go").click()};$("s").oninput=render;$("out").onclick=()=>{token="";$("app").style.display="none";$("login").style.display="block";$("p").value=""};</script></body></html>
