<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Uzmantech Admin"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="shortcut icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg"><title>Uzmantech Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#050b14;color:#eef5ff;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1100px;margin:auto;padding:16px}.card{background:#0c1727;border:1px solid #20334d;border-radius:18px;padding:18px;box-shadow:0 15px 45px #0008}.login{min-height:100vh;display:grid;place-items:center;padding:18px}.login .card{width:min(420px,100%)}h1{font-size:27px;margin:0 0 7px}.muted{color:#8fa4bd}.field{margin:12px 0}.field label{display:block;color:#8fa4bd;margin-bottom:6px;font-size:13px}.field input,.field select,.search{width:100%;padding:13px;border:1px solid #20334d;border-radius:11px;background:#07111f;color:#fff;outline:0}.pass{min-height:54px;font:18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;-webkit-appearance:none}.btn{border:0;border-radius:10px;padding:10px 13px;background:#17283d;color:#fff;cursor:pointer}.primary{width:100%;background:#2f80ed;padding:13px;font-weight:700}.danger{background:#642127}.success{background:#0d5b43}.warn{background:#725214}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:18px 0}.stat{padding:15px;background:#0c1727;border:1px solid #20334d;border-radius:15px}.num{font-size:26px;font-weight:800}.tabs{display:flex;gap:8px;margin-bottom:12px;overflow:auto}.tab.active{background:#17375f}.row{margin:10px 0;padding:15px;background:#0c1727;border:1px solid #20334d;border-radius:15px}.head{display:flex;justify-content:space-between;gap:12px}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#26354a;font-size:11px;white-space:nowrap}.badge.on{background:#103e32;color:#6df0b8}.badge.off{background:#4b2025;color:#ff9eaa}.badge.wait{background:#4a3512;color:#ffd27a}.toolbar{display:flex;gap:8px;margin-bottom:10px}.search{flex:1}.hidden{display:none!important}.err{color:#ff9d9d;background:#351517;border:1px solid #703035;padding:10px;border-radius:10px;margin:10px 0}.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 18px;margin-top:8px;font-size:13px}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:15px;z-index:20}.modalbox{width:min(520px,100%);max-height:90vh;overflow:auto}.close{float:right}.successText{color:#6df0b8}@media(max-width:750px){.stats{grid-template-columns:repeat(2,1fr)}.stats .stat:last-child{grid-column:span 2}.wrap{padding:12px}.head{align-items:flex-start}.meta{grid-template-columns:1fr}.actions .btn{flex:1;min-width:105px}}</style></head><body>
<div id="login" class="login"><div class="card"><h1>Uzmantech Admin</h1><div class="muted">Yönetim paneli</div><div class="field"><label>Kullanıcı adı</label><input id="user" autocomplete="username" autocapitalize="none" autocorrect="off"></div><div class="field"><label>Şifre</label><input id="pass" class="pass" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false"></div><div id="err" class="err hidden"></div><button id="loginBtn" class="btn primary">Giriş Yap</button></div></div>
<div id="app" class="hidden"><div class="wrap"><div style="display:flex;justify-content:space-between;align-items:center"><div><h1>Uzmantech Admin</h1><div class="muted">Yönetim Paneli</div></div><button class="btn" id="logout">Çıkış</button></div>
<div class="stats"><div class="stat"><div class="num" id="total">0</div><div class="muted">Toplam</div></div><div class="stat"><div class="num" id="active">0</div><div class="muted">Aktif</div></div><div class="stat"><div class="num" id="inactive">0</div><div class="muted">Pasif</div></div><div class="stat"><div class="num" id="pendingN">0</div><div class="muted">Bekleyen</div></div><div class="stat"><div class="num" id="devicesN">0</div><div class="muted">Cihaz</div></div></div>
<div class="tabs"><button class="btn tab active" data-tab="users">Kullanıcılar</button><button class="btn tab" data-tab="pending">Bekleyenler</button><button class="btn tab" data-tab="devices">Cihazlar</button><button class="btn tab" data-tab="logs">Admin Logları</button><button class="btn tab" data-tab="updates">Güncellemeler</button></div>
<section id="usersPanel"><div class="toolbar"><input id="search" class="search" placeholder="Kullanıcı, e-posta veya telefon ara"><button class="btn" id="refresh">Yenile</button><button class="btn primary" style="width:auto" id="addDays">Süre Ekle</button></div><div id="users"></div></section>
<section id="pendingPanel" class="hidden"><div class="toolbar"><button class="btn" id="refreshPending">Yenile</button></div><div id="pending"></div></section>
<section id="devicesPanel" class="hidden"><div class="toolbar"><button class="btn" id="refreshDevices">Yenile</button></div><div id="devices"></div></section><section id="logsPanel" class="hidden"><div class="toolbar"><select id="logUser" class="search" style="flex:0 0 220px"><option value="TÜMÜ">Tüm kullanıcılar</option></select><button class="btn" id="refreshLogs">Yenile</button></div><div id="logs"></div><div class="actions" id="logPager"></div></section><section id="updatesPanel" class="hidden"><div class="toolbar"><button class="btn" id="refreshUpdates">Yenile</button></div><div id="updates"></div></section></div></div>
<div id="editModal" class="modal hidden"><div class="card modalbox"><button class="btn close" id="closeEdit">Kapat</button><h2>Kullanıcı Düzenle</h2><input type="hidden" id="editId"><div class="field"><label>Kullanıcı adı</label><input id="editUsername" disabled></div><div class="field"><label>E-posta</label><input id="editEmail" type="email"></div><div class="field"><label>Telefon</label><input id="editPhone"></div><div class="field"><label>Rol</label><select id="editRole"><option value="user">Kullanıcı</option><option value="admin">Admin</option></select></div><div class="field"><label>Durum</label><select id="editStatus"><option value="active">Aktif</option><option value="disabled">Pasif</option><option value="pending">Bekleyen</option></select></div><div class="field"><label>Bitiş tarihi</label><input id="editExpiry" type="datetime-local"></div><div class="actions"><button class="btn primary" id="saveEdit">Kaydet</button><button class="btn danger" id="deleteUser">Kullanıcıyı Sil</button></div><div id="editErr" class="err hidden"></div></div></div>
<script>
const BASE="https://iutehccebzqnhqkevawz.supabase.co/functions/v1";let token="",users=[],devices=[],logs=[],updates=[];const $=x=>document.getElementById(x);
function show(id,on){$(id).classList.toggle("hidden",!on)}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function deviceHash(){let id=localStorage.getItem("uzm_admin_install_v4");if(!id){id=crypto.randomUUID();localStorage.setItem("uzm_admin_install_v4",id)}let h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(id));return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function login(){let username=$("user").value.trim(),password=$("pass").value;if(!username||!password)throw Error("Kullanıcı adı ve şifre zorunludur.");let r=await fetch(BASE+"/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,password,device_hash:await deviceHash()})}),j=await r.json().catch(()=>({}));if(!r.ok||!j.success||!j.session_token)throw Error(j.message||("Sunucu hatası: HTTP "+r.status));token=j.session_token;localStorage.setItem("uzm_admin_auth",token)}
async function api(action,data={}){let r=await fetch(BASE+"/rapid-service",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({action,...data})}),j=await r.json().catch(()=>({}));if(r.status===401){logout();throw Error("Oturum süresi doldu.")}if(!r.ok||j.success===false)throw Error(j.message||("İşlem başarısız. HTTP "+r.status));return j}
async function load(){
  try{let u=await api("list");users=u.users||[];render()}
  catch(e){$("users").innerHTML='<div class="err">Kullanıcılar yüklenemedi: '+esc(e.message)+'</div>'}
  try{let d=await api("list_devices");devices=d.devices||[];render()}
  catch(e){$("devices").innerHTML='<div class="err">Cihazlar yüklenemedi: '+esc(e.message)+'</div>'}
}
function statusText(s){return s==="active"?"Aktif":s==="pending"?"Bekliyor":s==="disabled"?"Pasif":s||"Bilinmiyor"}
function statusClass(s){return s==="active"?"on":s==="pending"?"wait":"off"}
function daysLeft(date){if(!date)return "";let n=new Date(date).getTime()-Date.now();if(n<=0)return "Süresi dolmuş";return Math.ceil(n/86400000)+" gün kaldı"}
function render(){let q=$("search").value.toLowerCase();let us=users.filter(x=>(x.username||"").toLowerCase().includes(q)||(x.email||"").toLowerCase().includes(q)||(x.phone||"").toLowerCase().includes(q));let active=users.filter(x=>x.status==="active"),pendingUsers=users.filter(x=>x.status==="pending"),inactive=users.filter(x=>x.status!=="active"&&x.status!=="pending");$("total").textContent=users.length;$("active").textContent=active.length;$("inactive").textContent=inactive.length;$("pendingN").textContent=pendingUsers.length;$("devicesN").textContent=devices.length;
$("users").innerHTML=us.length?us.map(u=>'<div class="row"><div class="head"><div><b>'+esc(u.username)+'</b> <span class="badge '+statusClass(u.status)+'">'+statusText(u.status)+'</span><div class="meta"><div>E-posta: '+esc(u.email||"-")+'</div><div>Telefon: '+esc(u.phone||"-")+'</div><div>Rol: '+esc(u.role||"user")+'</div><div>Plan: '+esc(u.license_plan||"-")+'</div><div>Bitiş: '+esc(u.expiry_date||"Yok")+'</div><div class="successText">'+esc(daysLeft(u.expiry_date))+'</div></div></div></div><div class="actions"><button class="btn success" data-id="'+u.id+'" onclick="activate(this.dataset.id,7)">+7 gün</button><button class="btn success" data-id="'+u.id+'" onclick="activate(this.dataset.id,30)">+30 gün</button><button class="btn warn" data-id="'+u.id+'" onclick="customExtend(this.dataset.id)">Süre Uzat</button><button class="btn" data-id="'+u.id+'" onclick="editUser(this.dataset.id)">Düzenle</button><button class="btn danger" data-id="'+u.id+'" onclick="disableUser(this.dataset.id)">Pasifleştir</button></div></div>').join(""):'<div class="card">Kullanıcı bulunamadı.</div>';
$("pending").innerHTML=pendingUsers.length?pendingUsers.map(u=>'<div class="row"><div class="head"><div><b>'+esc(u.username)+'</b><div class="muted">'+esc(u.email||"")+'</div><div class="muted">Kayıt: '+esc(u.created_at||"")+'</div></div><span class="badge wait">Bekliyor</span></div><div class="actions"><button class="btn success" data-id="'+u.id+'" onclick="activate(this.dataset.id,7)">7 gün aktif et</button><button class="btn success" data-id="'+u.id+'" onclick="activate(this.dataset.id,30)">30 gün aktif et</button><button class="btn" data-id="'+u.id+'" onclick="editUser(this.dataset.id)">Düzenle</button></div></div>').join(""):'<div class="card">Bekleyen kullanıcı yok.</div>';
$("devices").innerHTML=devices.length?devices.map(d=>'<div class="row"><b>'+esc(d.username||d.user_id||"Bilinmeyen")+'</b><div class="muted">Cihaz: '+esc(d.device_hash_masked||d.device_hash||"")+'<br>Engel: '+esc(d.blocked_until||"Yok")+'</div><div class="actions"><button class="btn success" data-id="'+d.id+'" onclick="unblock(this.dataset.id)">Engeli kaldır</button></div></div>').join(""):'<div class="card">Cihaz kaydı yok.</div>'}
async function activate(id,days){if(!confirm(days+" günlük aktivasyon yapılsın mı?"))return;try{await api("activate",{user_id:id,days});await load()}catch(e){alert(e.message)}}
async function customExtend(id){let d=prompt("Kaç gün eklensin?","30");if(d===null)return;let days=parseInt(d,10);if(!days||days<1||days>3650)return alert("1 ile 3650 arasında gün girin.");try{await api("extend",{user_id:id,days});await load()}catch(e){alert(e.message)}}
async function disableUser(id){if(!confirm("Bu kullanıcı pasifleştirilsin mi?"))return;try{await api("disable",{user_id:id});await load()}catch(e){alert(e.message)}}
async function unblock(id){if(!confirm("Cihaz engeli kaldırılsın mı?"))return;try{await api("unblock_device",{device_id:id});await load()}catch(e){alert(e.message)}}
function editUser(id){let u=users.find(x=>x.id===id);if(!u)return;$("editId").value=u.id;$("editUsername").value=u.username||"";$("editEmail").value=u.email||"";$("editPhone").value=u.phone||"";$("editRole").value=u.role||"user";$("editStatus").value=u.status||"disabled";let dt=u.expiry_date?new Date(u.expiry_date):null;$("editExpiry").value=dt&&!isNaN(dt)?new Date(dt.getTime()-dt.getTimezoneOffset()*60000).toISOString().slice(0,16):"";$("editErr").classList.add("hidden");show("editModal",true)}
async function saveEdit(){let id=$("editId").value;let data={user_id:id,email:$("editEmail").value.trim(),phone:$("editPhone").value.trim(),role:$("editRole").value,status:$("editStatus").value,expiry_date:$("editExpiry").value?new Date($("editExpiry").value).toISOString():null};try{await api("edit",data);show("editModal",false);await load()}catch(e){$("editErr").textContent=e.message;show("editErr",true)}}
async function deleteUser(){let id=$("editId").value;if(!confirm("Bu kullanıcı kalıcı olarak silinsin mi?"))return;try{await api("delete",{user_id:id});show("editModal",false);await load()}catch(e){$("editErr").textContent=e.message;show("editErr",true)}}
let logPage=1,logTotal=0;function populateLogUsers(){const s=$("logUser");if(!s)return;const current=s.value||"TÜMÜ";s.innerHTML='<option value="TÜMÜ">Tüm kullanıcılar</option>'+users.map(u=>'<option value="'+esc(u.username)+'">'+esc(u.username)+'</option>').join("");s.value=users.some(u=>u.username===current)?current:"TÜMÜ"}async function loadLogs(page=1){try{populateLogUsers();logPage=page;const username=$("logUser")?.value||"TÜMÜ";let r=await api("admin_logs",{page:logPage,limit:100,username});logs=r.logs||[];logTotal=Number(r.total||0);$("logs").innerHTML=logs.length?logs.map(x=>"<div class=\"row\"><div class=\"head\"><div><b>"+esc(x.username||"Bilinmeyen")+"</b> <span class=\"badge\">"+esc(x.category||"")+"</span></div><span class=\"muted\">"+esc(x.created_at||"")+"</span></div><div><b>"+esc(x.action||"İşlem")+"</b>"+(x.item_name?" • "+esc(x.item_name):"")+"</div><div class=\"muted\">Sonuç: "+esc(x.result||"")+" • Sürüm: "+esc(x.app_version||"")+"</div><div>"+esc(x.details||"")+"</div></div>").join(""):"<div class=\"card\">Aktivite logu bulunamadı.</div>";const totalPages=Math.max(1,Math.ceil(logTotal/100));$("logPager").innerHTML='<button class="btn" '+(logPage<=1?"disabled":"")+' onclick="loadLogs('+(logPage-1)+')">‹ Önceki</button><span class="muted" style="padding:10px">Sayfa '+logPage+' / '+totalPages+' • '+logTotal+' kayıt</span><button class="btn" '+(logPage>=totalPages?"disabled":"")+' onclick="loadLogs('+(logPage+1)+')">Sonraki ›</button>'}catch(e){$("logs").innerHTML="<div class=\"err\">"+esc(e.message)+"</div>"}} async function loadUpdates(){try{let r=await api("list_updates");updates=r.updates||[];$("updates").innerHTML=updates.length?updates.map(x=>"<div class=\"row\"><div class=\"head\"><div><b>"+esc(x.title||x.version||"Güncelleme")+"</b><div class=\"muted\">"+esc(x.version||"")+" • "+esc(x.created_at||"")+"</div></div><span class=\"badge "+(x.active?"on":"off")+"\">"+(x.active?"Aktif":"Pasif")+"</span></div><div>"+esc(x.notes||x.description||"")+"</div></div>").join(""):"<div class=\"card\">Güncelleme kaydı yok.</div>"}catch(e){$("updates").innerHTML="<div class=\"err\">"+esc(e.message)+"</div>"}} function logout(){token="";localStorage.removeItem("uzm_admin_auth");show("app",false);show("login",true);$("pass").value="";$("user").focus()}
async function restoreSession(){const saved=localStorage.getItem("uzm_admin_auth");if(!saved)return;token=saved;show("login",false);show("app",true);try{await load()}catch(e){logout()}}
$("loginBtn").onclick=async()=>{
  show("err",false);$("loginBtn").disabled=true;$("loginBtn").textContent="Giriş yapılıyor...";
  try{
    await login();
  }catch(e){
    $("err").textContent=e.message;show("err",true);
    $("loginBtn").disabled=false;$("loginBtn").textContent="Giriş Yap";
    return;
  }
  show("login",false);show("app",true);
  $("loginBtn").disabled=false;$("loginBtn").textContent="Giriş Yap";
  load();
};$("pass").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();$("loginBtn").click()}};$("logout").onclick=logout;$("refresh").onclick=load;$("refreshDevices").onclick=load;$("refreshPending").onclick=load;$("refreshLogs").onclick=()=>loadLogs(1);$("logUser").onchange=()=>loadLogs(1);$("refreshUpdates").onclick=loadUpdates;$("search").oninput=render;$("closeEdit").onclick=()=>show("editModal",false);$("saveEdit").onclick=saveEdit;$("deleteUser").onclick=deleteUser;$("addDays").onclick=()=>alert("Süre eklemek için kullanıcı kartındaki 'Süre Uzat' butonunu kullanın.");document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");show("usersPanel",b.dataset.tab==="users");show("pendingPanel",b.dataset.tab==="pending");show("devicesPanel",b.dataset.tab==="devices");show("logsPanel",b.dataset.tab==="logs");show("updatesPanel",b.dataset.tab==="updates");if(b.dataset.tab==="logs")loadLogs();if(b.dataset.tab==="updates")loadUpdates()});
restoreSession();</script></body></html>
