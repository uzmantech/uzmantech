<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Uzmantech Admin"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>Uzmantech Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#050b14;color:#eef5ff;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1000px;margin:auto;padding:16px}.card{background:#0c1727;border:1px solid #20334d;border-radius:18px;padding:18px;box-shadow:0 15px 45px #0008}.login{min-height:100vh;display:grid;place-items:center;padding:18px}.login .card{width:min(420px,100%)}h1{font-size:27px;margin:0 0 7px}.muted{color:#8fa4bd}.field{margin:14px 0}.field label{display:block;color:#8fa4bd;margin-bottom:6px;font-size:13px}.field input,.search{width:100%;padding:13px;border:1px solid #20334d;border-radius:11px;background:#07111f;color:#fff;outline:0}.btn{border:0;border-radius:10px;padding:10px 13px;background:#17283d;color:#fff;cursor:pointer}.primary{width:100%;background:#2f80ed;padding:13px;font-weight:700}.danger{background:#642127}.success{background:#0d5b43}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{padding:15px;background:#0c1727;border:1px solid #20334d;border-radius:15px}.num{font-size:26px;font-weight:800}.tabs{display:flex;gap:8px;margin-bottom:12px}.tab.active{background:#17375f}.row{margin:10px 0;padding:14px;background:#0c1727;border:1px solid #20334d;border-radius:15px}.head{display:flex;justify-content:space-between;gap:10px}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.badge{padding:5px 8px;border-radius:99px;background:#26354a;font-size:11px}.badge.on{background:#103e32;color:#6df0b8}.toolbar{display:flex;gap:8px;margin-bottom:10px}.search{flex:1}.hidden{display:none!important}.err{color:#ff9d9d;background:#351517;border:1px solid #703035;padding:10px;border-radius:10px;margin:10px 0}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:12px}.head{align-items:flex-start}}</style></head><body>
<div id="login" class="login"><div class="card"><h1>Uzmantech Admin</h1><div class="muted">Yönetim paneli</div><div class="field"><label>Kullanıcı adı</label><input id="user" autocomplete="username"></div><div class="field"><label>Şifre</label><input id="pass" type="text" inputmode="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" style="width:100%;min-height:54px;display:block;font:18px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;padding:14px 15px;border:1px solid #20334d;border-radius:13px;background:#07111f;color:#fff;outline:none;-webkit-appearance:none;-webkit-user-select:text;user-select:text"></div><div id="err" class="err hidden"></div><button id="loginBtn" class="btn primary">Giriş Yap</button></div></div>
<div id="app" class="hidden"><div class="wrap"><div style="display:flex;justify-content:space-between;align-items:center"><div><h1>Uzmantech Admin</h1><div class="muted">Yönetim Paneli</div></div><button class="btn" id="logout">Çıkış</button></div>
<div class="stats"><div class="stat"><div class="num" id="total">0</div><div class="muted">Toplam</div></div><div class="stat"><div class="num" id="active">0</div><div class="muted">Aktif</div></div><div class="stat"><div class="num" id="inactive">0</div><div class="muted">Pasif</div></div><div class="stat"><div class="num" id="devicesN">0</div><div class="muted">Cihaz</div></div></div>
<div class="tabs"><button class="btn tab active" data-tab="users">Kullanıcılar</button><button class="btn tab" data-tab="pending">Bekleyenler</button><button class="btn tab" data-tab="devices">Cihazlar</button></div>
<section id="usersPanel"><div class="toolbar"><input id="search" class="search" placeholder="Kullanıcı veya e-posta ara"><button class="btn" id="refresh">Yenile</button></div><div id="users"></div></section><section id="pendingPanel" class="hidden"><div class="toolbar"><button class="btn" id="refreshPending">Yenile</button></div><div id="pending"></div></section>
<section id="devicesPanel" class="hidden"><div class="toolbar"><button class="btn" id="refreshDevices">Yenile</button></div><div id="devices"></div></section></div></div>
<script>
const BASE="https://iutehccebzqnhqkevawz.supabase.co/functions/v1";let token=localStorage.getItem("uzm_admin_token")||"",users=[],devices=[];const $=x=>document.getElementById(x);
function show(id,on){$(id).classList.toggle("hidden",!on)}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function deviceHash(){let id=localStorage.getItem("uzm_installation_id");if(!id){id=crypto.randomUUID();localStorage.setItem("uzm_installation_id",id)}let h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(id));return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function login(){window._passMask=window._passMask||"";let r=await fetch(BASE+"/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("user").value.trim(),password:(window._passMask||""),device_hash:await deviceHash()})}),j=await r.json().catch(()=>({}));if(!r.ok||!j.success||!j.session_token)throw Error(j.message||"Giriş başarısız.");token=j.session_token;localStorage.setItem("uzm_admin_token",token)}
async function api(action,data={}){let r=await fetch(BASE+"/rapid-service",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({action,...data})}),j=await r.json().catch(()=>({}));if(r.status===401){logout();throw Error("Oturum süresi doldu.")}if(!r.ok)throw Error(j.message||"İşlem başarısız.");return j}
async function load(){try{let [u,d]=await Promise.all([api("list"),api("list_devices")]);users=u.users||[];devices=d.devices||[];render()}catch(e){if(token)alert(e.message)}}
function render(){let q=$("search").value.toLowerCase();let us=users.filter(x=>(x.username||"").toLowerCase().includes(q)||(x.email||"").toLowerCase().includes(q));$("total").textContent=users.length;$("active").textContent=users.filter(x=>x.status==="active").length;$("inactive").textContent=users.filter(x=>x.status!=="active").length;$("devicesN").textContent=devices.length;$("pending").innerHTML=users.filter(u=>u.status==="pending").length?users.filter(u=>u.status==="pending").map(u=>'<div class="row"><div class="head"><div><b>'+esc(u.username)+'</b><div class="muted">'+esc(u.email||"")+'</div><div class="muted">Kayıt: '+esc(u.created_at||"")+'</div></div><span class="badge">Bekliyor</span></div><div class="actions"><button class="btn success" onclick="activate(\\''+u.id+'\\',7)">7 gün aktif et</button><button class="btn success" onclick="activate(\\''+u.id+'\\',30)">30 gün aktif et</button></div></div>').join(""):'<div class="card">Bekleyen kullanıcı yok.</div>';$("users").innerHTML=us.length?us.map(u=>'<div class="row"><div class="head"><div><b>'+esc(u.username)+'</b><div class="muted">'+esc(u.email||"")+'</div><div class="muted">Bitiş: '+esc(u.expiry_date||"Yok")+' • Plan: '+esc(u.license_plan||"-")+'</div></div><span class="badge '+(u.status==="active"?"on":"")+'">'+esc(u.status)+'</span></div><div class="actions"><button class="btn" onclick="activate(\''+u.id+'\',7)">7 gün</button><button class="btn" onclick="activate(\''+u.id+'\',30)">30 gün</button><button class="btn success" onclick="extendUser(\''+u.id+'\')">+30 gün</button><button class="btn danger" onclick="disableUser(\''+u.id+'\')">Pasifleştir</button></div></div>').join(""):'<div class="card">Kullanıcı bulunamadı.</div>';$("devices").innerHTML=devices.length?devices.map(d=>'<div class="row"><b>'+esc(d.username||d.user_id||"Bilinmeyen")+'</b><div class="muted">Cihaz: '+esc(d.device_hash_masked||d.device_hash||"")+'<br>Engel: '+esc(d.blocked_until||"Yok")+'</div><div class="actions"><button class="btn success" onclick="unblock(\''+d.id+'\')">Engeli kaldır</button></div></div>').join(""):'<div class="card">Cihaz kaydı yok.</div>'}
async function activate(id,days){if(!confirm(days+" günlük lisans aktifleştirilsin mi?"))return;try{await api("activate",{user_id:id,days});load()}catch(e){alert(e.message)}}async function extendUser(id){if(!confirm("30 gün uzatılsın mı?"))return;try{await api("extend",{user_id:id,days:30});load()}catch(e){alert(e.message)}}async function disableUser(id){if(!confirm("Kullanıcı pasifleştirilsin mi?"))return;try{await api("disable",{user_id:id});load()}catch(e){alert(e.message)}}async function unblock(id){if(!confirm("Cihaz engeli kaldırılsın mı?"))return;try{await api("unblock_device",{device_id:id});load()}catch(e){alert(e.message)}}function logout(){token="";localStorage.removeItem("uzm_admin_token");show("app",false);show("login",true)}
$("loginBtn").onclick=async()=>{show("err",false);try{await login();show("login",false);show("app",true);load()}catch(e){$("err").textContent=e.message;show("err",true)}};$("pass").oninput=e=>{const v=e.target.value;if(!window._passMask){window._passMask="";}if(v.length<window._passMask.length){window._passMask=window._passMask.slice(0,v.length)}else if(v.length>window._passMask.length){window._passMask+=v.slice(window._passMask.length)}e.target.value="•".repeat(window._passMask.length)};$("pass").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();$("loginBtn").click()}};$("logout").onclick=logout;$("refresh").onclick=load;$("refreshDevices").onclick=load;$("refreshPending").onclick=load;$("search").oninput=render;document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");show("usersPanel",b.dataset.tab==="users");show("pendingPanel",b.dataset.tab==="pending");show("devicesPanel",b.dataset.tab==="devices")});if(token){show("login",false);show("app",true);load()}
</script></body></html>
