<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Uzmantech Admin"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>Uzmantech Admin v2</title><style>
*{box-sizing:border-box}body{margin:0;background:#050b14;color:#eef5ff;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1000px;margin:auto;padding:16px}.card{background:#0c1727;border:1px solid #20334d;border-radius:18px;padding:18px;box-shadow:0 15px 45px #0008}.login{min-height:100vh;display:grid;place-items:center;padding:18px}.login .card{width:min(420px,100%)}h1{font-size:27px;margin:0 0 7px}.muted{color:#8fa4bd}.field{margin:14px 0}.field label{display:block;color:#8fa4bd;margin-bottom:6px;font-size:13px}.field input,.search{width:100%;padding:13px;border:1px solid #20334d;border-radius:11px;background:#07111f;color:#fff;outline:0}.btn{border:0;border-radius:10px;padding:10px 13px;background:#17283d;color:#fff;cursor:pointer}.primary{width:100%;background:#2f80ed;padding:13px;font-weight:700}.danger{background:#642127}.success{background:#0d5b43}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{padding:15px;background:#0c1727;border:1px solid #20334d;border-radius:15px}.num{font-size:26px;font-weight:800}.tabs{display:flex;gap:8px;margin-bottom:12px}.tab.active{background:#17375f}.row{margin:10px 0;padding:14px;background:#0c1727;border:1px solid #20334d;border-radius:15px}.head{display:flex;justify-content:space-between;gap:10px}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.badge{padding:5px 8px;border-radius:99px;background:#26354a;font-size:11px}.badge.on{background:#103e32;color:#6df0b8}.toolbar{display:flex;gap:8px;margin-bottom:10px}.search{flex:1}.hidden{display:none!important}.err{color:#ff9d9d;background:#351517;border:1px solid #703035;padding:10px;border-radius:10px;margin:10px 0}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:12px}.head{align-items:flex-start}}</style></head><body>
<div id="login" class="login"><div class="card"><h1>Uzmantech Admin</h1><div class="muted">Yönetim paneli</div><div class="field"><label>Kullanıcı adı</label><input id="user" autocomplete="username"></div><div class="field"><label>Şifre</label><input id="pass" type="password" inputmode="text" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" style="width:100%;min-height:54px;display:block;font:18px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;padding:14px 15px;border:1px solid #20334d;border-radius:13px;background:#07111f;color:#fff;outline:none;-webkit-appearance:none;-webkit-user-select:text;user-select:text"></div><div id="err" class="err hidden"></div><button id="loginBtn" class="btn primary">Giriş Yap</button></div></div>
<div id="app" class="hidden"><div class="wrap"><div style="display:flex;justify-content:space-between;align-items:center"><div><h1>Uzmantech Admin</h1><div class="muted">Yönetim Paneli</div></div><button class="btn" id="logout">Çıkış</button></div>
<div class="stats"><div class="stat"><div class="num" id="total">0</div><div class="muted">Toplam</div></div><div class="stat"><div class="num" id="active">0</div><div class="muted">Aktif</div></div><div class="stat"><div class="num" id="inactive">0</div><div class="muted">Pasif</div></div><div class="stat"><div class="num" id="devicesN">0</div><div class="muted">Cihaz</div></div></div>
<div class="tabs"><button class="btn tab active" data-tab="users">Kullanıcılar</button><button class="btn tab" data-tab="pending">Bekleyenler</button><button class="btn tab" data-tab="devices">Cihazlar</button><button class="btn tab" data-tab="logs">İşlem Geçmişi</button><button class="btn tab" data-tab="updates">Güncellemeler</button></div>
<section id="usersPanel"><div class="toolbar"><input id="search" class="search" placeholder="Kullanıcı, e-posta veya telefon ara"><select id="statusFilter" class="search" style="max-width:160px"><option value="">Tüm durumlar</option><option value="active">Aktif</option><option value="pending">Bekleyen</option><option value="disabled">Pasif</option></select><select id="expiryFilter" class="search" style="max-width:180px"><option value="">Tüm lisanslar</option><option value="7">7 gün içinde bitecek</option><option value="expired">Süresi dolmuş</option></select><button class="btn" id="export">CSV</button><button class="btn" id="refresh">Yenile</button></div><div class="card" style="margin-bottom:10px"><div class="toolbar" style="margin:0"><label><input id="selectAll" type="checkbox"> Tümünü seç</label><button class="btn success" id="bulk7" disabled>Seçilen +7 gün</button><button class="btn success" id="bulk30" disabled>Seçilen +30 gün</button><button class="btn danger" id="bulkDisable" disabled>Seçilenleri pasifleştir</button><span id="selectedCount" class="muted">0 seçili</span></div></div><div id="users"></div></section><section id="pendingPanel" class="hidden"><div class="toolbar"><button class="btn" id="refreshPending">Yenile</button></div><div id="pending"></div></section>
<section id="logsPanel" class="hidden"><div class="toolbar"><button class="btn" id="refreshLogs">Yenile</button></div><div id="logs"></div></section><section id="updatesPanel" class="hidden"><div class="card"><h3 style="margin-top:0">Uygulama güncellemesi</h3><div class="field"><label>Sürüm</label><input id="updVersion" placeholder="1.1.4"></div><div class="field"><label>İndirme bağlantısı</label><input id="updUrl" placeholder="https://..."></div><div class="field"><label>Değişiklik notları</label><textarea id="updNotes" style="width:100%;min-height:100px;background:#07111f;color:#fff;border:1px solid #20334d;border-radius:11px;padding:12px"></textarea></div><label><input id="updMandatory" type="checkbox"> Zorunlu</label> <label><input id="updActive" type="checkbox" checked> Aktif</label> <button class="btn primary" id="saveUpdate">Kaydet</button></div><div id="updates" style="margin-top:10px"></div></section><section id="devicesPanel" class="hidden"><div class="toolbar"><button class="btn" id="refreshDevices">Yenile</button></div><div id="devices"></div></section></div></div>
<div id="userModal" class="hidden" style="position:fixed;inset:0;background:#000b;z-index:20;padding:16px;display:grid;place-items:center"><div class="card" style="width:min(680px,100%);max-height:92vh;overflow:auto"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="userModalTitle" style="margin:0">Kullanıcı</h2><button class="btn" id="closeUserModal">Kapat</button></div><div id="userModalBody" style="margin-top:15px"></div></div></div><script>
const BASE="https://iutehccebzqnhqkevawz.supabase.co/functions/v1";let token=localStorage.getItem("uzm_admin_token_v2")||"",users=[],devices=[];const $=x=>document.getElementById(x);
function show(id,on){$(id).classList.toggle("hidden",!on)}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function deviceHash(){let id=localStorage.getItem("uzm_installation_id");if(!id){id=crypto.randomUUID();localStorage.setItem("uzm_installation_id",id)}let h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(id));return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function login(){window._passMask=window._passMask||"";let r=await fetch(BASE+"/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("user").value.trim(),password:$("pass").value,device_hash:await deviceHash()})}),j=await r.json().catch(()=>({}));if(!r.ok||!j.success||!j.session_token)throw Error(j.message||"Giriş başarısız.");token=j.session_token;localStorage.setItem("uzm_admin_token_v2",token)}
async function api(action,data={}){let r=await fetch(BASE+"/rapid-service",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({action,...data})}),j=await r.json().catch(()=>({}));if(r.status===401){logout();throw Error("Oturum süresi doldu.")}if(!r.ok)throw Error(j.message||"İşlem başarısız.");return j}
async function load(){try{let [u,d]=await Promise.all([api("list"),api("list_devices")]);users=u.users||[];devices=d.devices||[];render()}catch(e){if(token)alert(e.message)}}
function remainingDays(u){if(!u.expiry_date)return null;return Math.ceil((new Date(u.expiry_date)-Date.now())/86400000)}
function selectedIds(){return [...document.querySelectorAll(".ucheck:checked")].map(x=>x.dataset.id)}
function updateBulk(){const n=selectedIds().length;$("selectedCount").textContent=n+" seçili";["bulk7","bulk30","bulkDisable"].forEach(id=>$(id).disabled=!n)}
function render(){
 let q=$("search").value.toLowerCase(),sf=$("statusFilter").value,ef=$("expiryFilter").value;
 let us=users.filter(x=>{let t=[x.username,x.email,x.phone].join(" ").toLowerCase();if(q&&!t.includes(q))return false;if(sf&&x.status!==sf)return false;let d=remainingDays(x);if(ef==="7"&&!(d!==null&&d>=0&&d<=7))return false;if(ef==="expired"&&!(d!==null&&d<0))return false;return true});
 $("total").textContent=users.length;$("active").textContent=users.filter(x=>x.status==="active").length;$("inactive").textContent=users.filter(x=>x.status!=="active").length;$("devicesN").textContent=devices.length;
 const p=users.filter(u=>u.status==="pending");
 $("pending").innerHTML=p.length?p.map(u=>'<div class="row"><div class="head"><div><b>'+esc(u.username)+'</b><div class="muted">'+esc(u.email||"")+'</div><div class="muted">Kayıt: '+esc(u.created_at||"")+'</div></div><span class="badge">Bekliyor</span></div><div class="actions"><button class="btn success" onclick="activate(\''+u.id+'\',7)">7 gün aktif et</button><button class="btn success" onclick="activate(\''+u.id+'\',30)">30 gün aktif et</button></div></div>').join(""):'<div class="card">Bekleyen kullanıcı yok.</div>';
 $("users").innerHTML=us.length?us.map(u=>{let d=remainingDays(u);return '<div class="row"><div class="head"><div><input type="checkbox" class="ucheck" data-id="'+esc(u.id)+'" '+(u.role==="admin"?"disabled":"")+' style="width:18px;height:18px;vertical-align:middle;margin-right:7px"><b>'+esc(u.username)+'</b><div class="muted">'+esc(u.email||"")+(u.phone?" • "+esc(u.phone):"")+'</div><div class="muted">Bitiş: '+esc(u.expiry_date||"Yok")+' • '+(d===null?"Süresiz":d<0?Math.abs(d)+" gün geçmiş":d+" gün kaldı")+'</div></div><span class="badge '+(u.status==="active"?"on":d!==null&&d<0?"warn":"")+'">'+esc(u.status)+'</span></div><div class="actions"><button class="btn primary" onclick="openUserModal(\''+u.id+'\')">Detay / Düzenle</button><button class="btn" onclick="activate(\''+u.id+'\',7)">7 gün</button><button class="btn" onclick="activate(\''+u.id+'\',30)">30 gün</button><button class="btn success" onclick="extendUser(\''+u.id+'\')">+30 gün</button><button class="btn danger" onclick="disableUser(\''+u.id+'\')">Pasifleştir</button></div></div>}).join(""):'<div class="card">Kullanıcı bulunamadı.</div>';
 $("devices").innerHTML=devices.length?devices.map(d=>'<div class="row"><div class="head"><div><b>'+esc(d.username||d.user_id||"Bilinmeyen")+'</b><div class="muted">Cihaz: '+esc(d.device_hash_masked||"")+'<br>Engel: '+esc(d.blocked_until||"Yok")+'</div></div><span class="badge '+(d.blocked_until?"":"on")+'">'+(d.blocked_until?"Engelli":"Serbest")+'</span></div><div class="actions"><button class="btn success" onclick="unblock(\''+d.id+'\')">Engeli kaldır</button></div></div>').join(""):'<div class="card">Cihaz kaydı yok.</div>';
 document.querySelectorAll(".ucheck").forEach(x=>x.onchange=updateBulk);updateBulk();
}
function openUserModal(id){const u=users.find(x=>x.id===id);if(!u)return;$("userModalTitle").textContent=u.username+" • Detay";$("userModalBody").innerHTML='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><span class="muted">E-posta</span><br><b>'+esc(u.email||"Yok")+'</b></div><div><span class="muted">Telefon</span><br><b>'+esc(u.phone||"Yok")+'</b></div><div><span class="muted">Rol</span><br><b>'+esc(u.role)+'</b></div><div><span class="muted">Durum</span><br><b>'+esc(u.status)+'</b></div><div><span class="muted">Kayıt</span><br><b>'+esc(u.created_at||"Yok")+'</b></div><div><span class="muted">Son giriş</span><br><b>'+esc(u.last_login||"Yok")+'</b></div></div><hr style="border-color:#20334d;margin:18px 0"><div class="field"><label>E-posta</label><input id="mEmail" value="'+esc(u.email||"")+'"></div><div class="field"><label>Telefon</label><input id="mPhone" value="'+esc(u.phone||"")+'"></div><div class="field"><label>Rol</label><select id="mRole"><option value="user">user</option><option value="admin">admin</option></select></div><div class="field"><label>Durum</label><select id="mStatus"><option value="active">active</option><option value="pending">pending</option><option value="disabled">disabled</option></select></div><div class="field"><label>Lisans bitiş tarihi</label><input id="mExpiry" type="datetime-local" value="'+(u.expiry_date?new Date(u.expiry_date).toISOString().slice(0,16):"")+'"></div><div class="actions"><button class="btn primary" onclick="saveUserEdit(\''+u.id+'\')">Kaydet</button><button class="btn success" onclick="activate(\''+u.id+'\',30)">+30 gün</button><button class="btn danger" onclick="disableUser(\''+u.id+'\')">Pasifleştir</button><button class="btn danger" onclick="deleteUser(\''+u.id+'\')">Sil</button></div>';$("mRole").value=u.role;$("mStatus").value=u.status;show("userModal",true)}
async function saveUserEdit(id){try{await api("edit",{user_id:id,email:$("mEmail").value.trim(),phone:$("mPhone").value.trim(),role:$("mRole").value,status:$("mStatus").value,expiry_date:$("mExpiry").value?new Date($("mExpiry").value).toISOString():null});show("userModal",false);alert("Kullanıcı güncellendi.");load()}catch(e){alert(e.message)}}
async function disableUser(id){if(!confirm("Kullanıcı pasifleştirilsin mi?"))return;try{await api("disable",{user_id:id});show("userModal",false);load()}catch(e){alert(e.message)}}
async function deleteUser(id){if(!confirm("Bu kullanıcı kalıcı olarak silinsin mi?"))return;if(!confirm("Son onay?"))return;try{await api("delete",{user_id:id});show("userModal",false);load()}catch(e){alert(e.message)}}
async function bulkAction(type){const ids=selectedIds();if(!ids.length)return;if(!confirm(ids.length+" kullanıcı için işlem uygulansın mı?"))return;for(const id of ids){try{if(type==="disable")await api("disable",{user_id:id});else await api("activate",{user_id:id,days:type})}catch(e){alert(e.message);break}}$("selectAll").checked=false;load()}
async function loadLogs(){try{const j=await api("admin_logs",{limit:300});$("logs").innerHTML=(j.logs||[]).map(l=>'<div class="row"><b>'+esc(l.action)+'</b><div class="muted">'+esc(l.created_at)+' • hedef: '+esc(l.item_name||"-")+'</div><div style="margin-top:6px">'+esc(l.details||"")+'</div></div>').join("")||'<div class="card">Henüz admin işlem kaydı yok.</div>'}catch(e){$("logs").innerHTML='<div class="card err">'+esc(e.message)+'</div>'}}
async function loadUpdates(){try{const j=await api("list_updates");window._updates=j.updates||[];$("updates").innerHTML=window._updates.map(u=>'<div class="row"><div class="head"><div><b>v'+esc(u.version)+'</b><div class="muted">'+esc(u.created_at)+' • '+(u.mandatory?"Zorunlu":"Normal")+'</div></div><span class="badge '+(u.is_active?"on":"")+'">'+(u.is_active?"Aktif":"Pasif")+'</span></div><div class="muted" style="word-break:break-all;margin-top:6px">'+esc(u.download_url)+'</div><div style="margin-top:6px;white-space:pre-wrap">'+esc(u.release_notes||"")+'</div><div class="actions"><button class="btn" onclick="editUpdate(\''+u.id+'\')">Düzenle</button><button class="btn success" onclick="activateUpdate(\''+u.id+'\')">Aktif yap</button></div></div>').join("")||'<div class="card">Güncelleme kaydı yok.</div>'}catch(e){$("updates").innerHTML='<div class="card err">'+esc(e.message)+'</div>'}}
function editUpdate(id){const u=(window._updates||[]).find(x=>x.id===id);if(!u)return;$("updVersion").value=u.version;$("updUrl").value=u.download_url;$("updNotes").value=u.release_notes||"";$("updMandatory").checked=!!u.mandatory;$("updActive").checked=!!u.is_active;$("saveUpdate").dataset.id=id}
async function saveUpdate(){try{await api("save_update",{id:$("saveUpdate").dataset.id||"",version:$("updVersion").value.trim(),download_url:$("updUrl").value.trim(),release_notes:$("updNotes").value,mandatory:$("updMandatory").checked,is_active:$("updActive").checked});$("saveUpdate").dataset.id="";alert("Güncelleme kaydedildi.");loadUpdates()}catch(e){alert(e.message)}}
async function activateUpdate(id){try{await api("set_update_active",{id});alert("Aktif sürüm değiştirildi.");loadUpdates()}catch(e){alert(e.message)}}
async function activate(id,days){if(!confirm(days+" günlük lisans aktifleştirilsin mi?"))return;try{await api("activate",{user_id:id,days});load()}catch(e){alert(e.message)}}async function extendUser(id){if(!confirm("30 gün uzatılsın mı?"))return;try{await api("extend",{user_id:id,days:30});load()}catch(e){alert(e.message)}}async function disableUser(id){if(!confirm("Kullanıcı pasifleştirilsin mi?"))return;try{await api("disable",{user_id:id});load()}catch(e){alert(e.message)}}async function unblock(id){if(!confirm("Cihaz engeli kaldırılsın mı?"))return;try{await api("unblock_device",{device_id:id});load()}catch(e){alert(e.message)}}function logout(){token="";localStorage.removeItem("uzm_admin_token_v2");localStorage.removeItem("uzm_admin_token");show("app",false);show("login",true)}
$("loginBtn").onclick=async()=>{show("err",false);try{await login();show("login",false);show("app",true);load()}catch(e){$("err").textContent=e.message;show("err",true)}};$("pass").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();$("loginBtn").click()}};$("logout").onclick=logout;$("refresh").onclick=load;$("refreshDevices").onclick=load;$("refreshPending").onclick=load;$("search").oninput=render;document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");show("usersPanel",b.dataset.tab==="users");show("pendingPanel",b.dataset.tab==="pending");show("devicesPanel",b.dataset.tab==="devices");show("logsPanel",b.dataset.tab==="logs");show("updatesPanel",b.dataset.tab==="updates");if(b.dataset.tab==="logs")loadLogs();if(b.dataset.tab==="updates")loadUpdates()});$("statusFilter").onchange=render;$("expiryFilter").onchange=render;$("selectAll").onchange=e=>{document.querySelectorAll(".ucheck:not(:disabled)").forEach(x=>x.checked=e.target.checked);updateBulk()};$("bulk7").onclick=()=>bulkAction(7);$("bulk30").onclick=()=>bulkAction(30);$("bulkDisable").onclick=()=>bulkAction("disable");$("closeUserModal").onclick=()=>show("userModal",false);$("refreshLogs").onclick=loadLogs;$("saveUpdate").onclick=saveUpdate;$("export").onclick=()=>{const csv=[["Kullanıcı","E-posta","Telefon","Rol","Durum","Bitiş","Son giriş"],...users.map(u=>[u.username,u.email,u.phone,u.role,u.status,u.expiry_date,u.last_login])].map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));a.download="uzmantech-kullanicilar.csv";a.click()};if(token){show("login",false);show("app",true);load()}
</script></body></html>
